name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the checked-out code.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install ruff
        uses: astral-sh/ruff-action@v3

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      # No test suite yet; at minimum every module must byte-compile so a
      # syntax error can't reach a device boot.
      - name: Byte-compile all modules
        run: python3 -m compileall -q . -x '(env|\.venv)/'
