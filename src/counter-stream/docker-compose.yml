services:
  rpi-streamer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crowdcount-streamer
    restart: unless-stopped

    # Camera access
    privileged: true
    devices:
      - /dev/video0:/dev/video0
      - /dev/media0:/dev/media0
      - /dev/media1:/dev/media1
      - /dev/media2:/dev/media2
      - /dev/vchiq:/dev/vchiq
      - /dev/vcsm:/dev/vcsm
      - /dev/dma_heap:/dev/dma_heap

    # Mount host libcamera
    volumes:
      - /usr/lib:/usr/lib:ro
      - /usr/share/libcamera:/usr/share/libcamera:ro
      - /etc/libcamera:/etc/libcamera:ro
      - ./logs:/app/logs
      - ./.env:/app/.env:ro

    # Use host network
    network_mode: host

    environment:
      - LIBCAMERA_LOG_LEVELS=*:ERROR
      - LD_LIBRARY_PATH=/usr/lib/aarch64-linux-gnu:/usr/lib

    healthcheck:
      test: ["CMD", "python3", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"