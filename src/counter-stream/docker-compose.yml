services:
  rpi-streamer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crowdcount-streamer
    restart: unless-stopped

    # Camera access
    privileged: true
    devices:
      - /dev/video0:/dev/video0
      - /dev/media0:/dev/media0
      - /dev/vchiq:/dev/vchiq   # optional on Pi 5; harmless if present

    # Add video/render groups if needed
    group_add:
      - "44"   # video
      - "109"  # render (often present on Pi 5)

    # Minimal, no longer mounting legacy /opt/vc or host libcamera data
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env:ro

    # Use host network for low-latency streaming
    network_mode: host

    environment:
      - LIBCAMERA_LOG_LEVELS=*:2
      - DISPLAY=:0

    healthcheck:
      test: ["CMD", "python3", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"